[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daydream-remote"
version = "0.3.0"
description = "Google Daydream VR controller to mouse/keyboard bridge via BLE + uinput"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "bleak>=0.21",
    "python-uinput>=0.11",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
daydream = "daydream:cli_main"
daydream-remote = "daydream:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["daydream.py"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
